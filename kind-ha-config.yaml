kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # --- NATS ---
  - containerPort: 30422
    hostPort: 4222
    listenAddress: "0.0.0.0" # NATS Client
  - containerPort: 30822
    hostPort: 8222
    listenAddress: "0.0.0.0" # NATS Monitoring
  
  # --- Kafka (NodePort 30094 예정) ---
  - containerPort: 30094
    hostPort: 9094
    listenAddress: "0.0.0.0"
    
  # --- RabbitMQ ---
  - containerPort: 30672
    hostPort: 5672
    listenAddress: "0.0.0.0" # AMQP
  - containerPort: 31672
    hostPort: 15672
    listenAddress: "0.0.0.0" # Web UI

  # --- Redis (Valkey) ---
  - containerPort: 30379
    hostPort: 6379
    listenAddress: "0.0.0.0"

  # --- Redpanda ---
  - containerPort: 30093
    hostPort: 9093
    listenAddress: "0.0.0.0" # Kafka API External
  - containerPort: 30644
    hostPort: 9644
    listenAddress: "0.0.0.0" # Admin API

  # --- Pulsar ---
  - containerPort: 30650
    hostPort: 6650
    listenAddress: "0.0.0.0" # Binary
  - containerPort: 30080
    hostPort: 8080
    listenAddress: "0.0.0.0" # HTTP Admin

  # --- Grafana (Monitoring) ---
  - containerPort: 30000
    hostPort: 3000
    listenAddress: "0.0.0.0"

# Worker Nodes for HA Testing
- role: worker
- role: worker
- role: worker
