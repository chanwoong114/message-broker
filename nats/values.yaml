# NATS Helm Values for HA & JetStream

config:
  cluster:
    enabled: true
    replicas: 3
    noAdvertise: true 
  
  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 5Gi
    memoryStore:
      enabled: true
      maxSize: 1Gi

# 서비스 설정 (Exporter 포트 추가)
service:
  enabled: true
  ports:
    nats:
      enabled: true
    monitor:
      enabled: true
    metrics:
      enabled: true
      port: 7777
      name: metrics

natsBox:
  enabled: true

# Prometheus Exporter 활성화
promExporter:
  enabled: true
  image:
    repository: natsio/prometheus-nats-exporter
    tag: 0.15.0
    pullPolicy: IfNotPresent
  podMonitor:
    enabled: false
