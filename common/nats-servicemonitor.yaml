apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nats-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  namespaceSelector:
    matchNames:
      - nats
  endpoints:
    - port: monitor
      path: /metrics
